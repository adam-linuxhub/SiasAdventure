<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sia's Adventure</title>

    <link rel="icon" href="images/ui/star.png">
  <script type="module" crossorigin src="/assets/start-BSg_3Zkr.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/style-CQyF9PL7.js">
  <link rel="stylesheet" crossorigin href="/assets/style-Bjzy1oOt.css">
</head>


<body>

    <main class="adventure-container">

        <header class="game-header">

            <h1 class="academy-title">
                ✨ Sia's Adventure ✨
            </h1>

            <p class="academy-subtitle">
                Academy of Knowledge
            </p>

            <p class="academy-description">
                Your magical journey of learning, discovery and achievement begins.
            </p>

        </header>


        <section class="characters">


            <div class="character-card">

                <div class="character-image wizard">
                    <img
                        src="/assets/wizzy-DbYoABQA.png"
                        alt="Wizzy">
                </div>

                <h2>Wizzy</h2>

                <p>
                    Your friendly wizard guide.
                </p>

            </div>



            <div class="character-card">

                <div class="character-image owl">
                    <img
                        src="/assets/hootie-B7F1PQV5.png"
                        alt="Hootie">
                </div>

                <h2>Hootie</h2>

                <p>
                    Your clever hint helper.
                </p>

            </div>



            <div class="character-card">

                <div class="character-image rabbit">
                    <img
                        src="/assets/hop-DKKx4U84.png"
                        alt="Hop">
                </div>

                <h2>Hop</h2>

                <p>
                    Your celebration friend.
                </p>

            </div>


        </section>


        <section class="adventure-panel">


            <h2>
                Ready for an adventure?
            </h2>


            <button type="button" class="magic-button"
                onclick="startAdventure()">

                ▶ Start Adventure

            </button>



            <button type="button" class="magic-button secondary"
                onclick="continueAdventure()">

                ⭐ Continue Adventure

            </button>



            <button type="button" class="magic-button secondary"
                onclick="openDashboard()">

                📈 My Progress

            </button>


        </section>



        <section class="player-stats">


            <h3>
                Explorer Level
            </h3>


            <div
                class="level"
                id="current-level">

                Loading...

            </div>


            <div class="xp-bar">

                <div class="xp-progress"></div>

            </div>


            <p>

            ⭐ Stars:
            <strong id="stars">

            0

            </strong>

            </p>


            <p>

            🎁 Treasure Chests:
            <strong id="treasure-count">

            0

            </strong>

            </p>


        </section>



    </main>





</body>

</html>
