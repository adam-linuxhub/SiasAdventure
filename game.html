<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sia's Adventure - Quiz</title>

    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/style.css">
</head>


<body>


<main class="adventure-container">


<header class="game-header">

<h1>
✨ Sia's Adventure ✨
</h1>


<div class="player-bar">

<span>
⭐ Stars: <strong id="stars">0</strong>
</span>


<span>
🏆 Level: <strong id="level">Explorer</strong>
</span>


</div>


</header>



<section class="question-layout">


<div class="question-area">


<div class="character-image wizard">

🧙‍♂️

</div>


<h2>
Wizzy's Question
</h2>


<div class="question-card">


<p id="question-text">

Loading question...

</p>


<form id="answer-form">


<div id="answers">

</div>


</form>


</div>


<div id="explanation"
class="explanation hidden">

</div>



<div class="buttons">


<button 
class="magic-button"
id="submit-answer">

Submit

</button>


<button
class="magic-button secondary"
id="dont-know">

I Don't Know

</button>


</div>


</div>




<aside class="hint-area">


<div class="character-image owl">

🦉

</div>


<h2>
Hootie
</h2>


<div class="hint-box">


Hover here for a hint


<p id="hint-text">

</p>


</div>


</aside>


</section>



<section>


<h3>
Adventure Progress
</h3>


<div class="xp-bar">

<div 
id="xp-progress"
class="xp-progress">

</div>

</div>


</section>



</main>



<script src="js/storage.js"></script>
<script src="js/game.js"></script>


</body>

</html>
