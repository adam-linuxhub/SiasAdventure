<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sia's Adventure</title>

    <link rel="icon"
          href="images/ui/star.png">

    <link rel="stylesheet"
          href="css/theme.css">

    <link rel="stylesheet"
          href="css/style.css">

    <link rel="stylesheet"
          href="css/start.css">

</head>

<body>

<main class="adventure-container">
    <div id="stars"></div>

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="game-header">

        <h1 class="academy-title">

            ✨ Sia's Adventure ✨

        </h1>

        <p class="academy-subtitle">

            Academy of Knowledge

        </p>

    </header>


    <!-- =====================================================
         STORY
    ====================================================== -->

    <section class="story-panel">

        <h2>

            The Adventure Begins!

        </h2>

        <p>

            Oh no!

            <strong>Wizzy</strong>

            has lost the

            <strong>Magical Potion of Knowledge</strong>.

            Help him answer questions,
            collect stars,
            unlock treasure chests
            and restore the Academy's magic!

        </p>

    </section>


    <!-- =====================================================
         CHARACTERS
    ====================================================== -->

    <section class="characters">

        <div class="character-card"
             data-character="hootie">

            <img
                src="images/characters/hootie.png"
                alt="Hootie">

        </div>

        <div class="character-card wizzy-card"
             data-character="wizzy">

            <img
                src="images/characters/wizzy.png"
                alt="Wizzy">

        </div>

        <div class="character-card"
             data-character="hop">

            <img
                src="images/characters/hop.png"
                alt="Hop">

        </div>

    </section>


    <!-- =====================================================
         SPEECH BUBBLE
    ====================================================== -->

    <div id="speech-bubble"
         class="speech-bubble">

        <div id="speech-name"
             class="speech-name">

        </div>

        <div id="speech-text">

        </div>

    </div>


    <!-- =====================================================
         BUTTON
    ====================================================== -->

    <section class="button-panel">

        <button
            class="magic-button"
            onclick="startAdventure()">

            Start Adventure

        </button>

    </section>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="start-footer">

        Sia's Adventure • Version 1.0 • © 2026

    </footer>

</main>


<script type="module"
        src="/src/main.ts"></script>

</body>

</html>
