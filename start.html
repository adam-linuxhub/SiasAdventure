<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sia's Adventure</title>

    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/style.css">
</head>


<body>

    <main class="adventure-container">

        <header class="game-header">

            <h1>
                ✨ Sia's Adventure ✨
            </h1>

            <p>
                Your magical 11+ learning adventure begins!
            </p>

        </header>


        <section class="characters">


            <div class="character-card">

                <div class="character-image wizard">
                    🧙‍♂️
                </div>

                <h2>Wizzy</h2>

                <p>
                    Your friendly wizard guide.
                </p>

            </div>



            <div class="character-card">

                <div class="character-image owl">
                    🦉
                </div>

                <h2>Hootie</h2>

                <p>
                    Your clever hint helper.
                </p>

            </div>



            <div class="character-card">

                <div class="character-image rabbit">
                    🐇
                </div>

                <h2>Hop</h2>

                <p>
                    Your celebration friend.
                </p>

            </div>


        </section>


        <section class="adventure-panel">


            <h2>
                Ready for an adventure?
            </h2>


            <button class="magic-button"
                onclick="startAdventure()">

                ▶ Start Adventure

            </button>



            <button class="magic-button secondary"
                onclick="continueAdventure()">

                ⭐ Continue Adventure

            </button>



            <button class="magic-button secondary"
                onclick="openDashboard()">

                📈 My Progress

            </button>


        </section>



        <section class="player-stats">


            <h3>
                Explorer Level
            </h3>


            <div class="level">

                Level 1

            </div>


            <div class="xp-bar">

                <div class="xp-progress"></div>

            </div>


            <p>
                ⭐ Stars: 0
            </p>


            <p>
                🎁 Treasure Chests: 0
            </p>


        </section>



    </main>



<script src="js/app.js"></script>


</body>

</html>
