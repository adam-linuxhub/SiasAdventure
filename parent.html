<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Sia's Adventure - Parent Dashboard
    </title>


    <link
        rel="icon"
        href="images/ui/star.png">


    <link
        rel="stylesheet"
        href="css/theme.css">


    <link
        rel="stylesheet"
        href="css/parent.css">


</head>


<body>


<main class="parent-page">


    <header class="parent-header">

        <h1>

            👨‍👩‍👧 Parent Dashboard

        </h1>


        <p>

            Monitor Sia's learning journey.

        </p>


    </header>



    <section class="dashboard-grid">


        <!-- ==========================
             Overall Progress
        =========================== -->

        <div class="dashboard-card">


            <h2>

                ⭐ Overall Progress

            </h2>


            <div
                id="overall-progress">

            </div>


        </div>




        <!-- ==========================
             Statistics
        =========================== -->

        <div class="dashboard-card">


            <h2>

                📊 Statistics

            </h2>


            <div
                id="statistics">

            </div>


        </div>




        <!-- ==========================
             Treasure Collection
        =========================== -->

        <div class="dashboard-card">


            <h2>

                💎 Treasure Collection

            </h2>


            <div
                id="treasure-gallery">

            </div>


        </div>



        <!-- ==========================
             Skills Report
        =========================== -->

        <div class="dashboard-card">


            <h2>

                📚 Skills Report

            </h2>


            <div
                id="skills-report">

            </div>


        </div>



        <!-- ==========================
             Needs Practice
        =========================== -->

        <div class="dashboard-card">


            <h2>

                🎯 Needs Practice

            </h2>


            <div
                id="needs-practice">

            </div>


        </div>



        <!-- ==========================
             Strongest Skills
        =========================== -->

        <div class="dashboard-card">


            <h2>

                🌟 Strongest Skills

            </h2>


            <div
                id="strongest-skills">

            </div>


        </div>



        <!-- ==========================
             Achievements
        =========================== -->

        <div class="dashboard-card">


            <h2>

                🏅 Achievements

            </h2>


            <div
                id="achievements">

            </div>


        </div>



    </section>


</main>



<script
    type="module"
    src="/src/parent.ts">
</script>


</body>

</html>
