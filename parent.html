<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Sia's Adventure - Parent Dashboard
    </title>


    <link
        rel="icon"
        href="images/ui/star.png">


    <link
        rel="stylesheet"
        href="css/theme.css">


    <link
        rel="stylesheet"
        href="css/parent.css">


</head>


<body>


<main class="parent-page">


    <header class="parent-header">

        <div>

            <h1>

                Parent Dashboard

            </h1>

            <p>

                Monitor your child's learning progress and identify areas requiring additional support.

            </p>

        </div>

    </header>



 <section class="parent-summary">

    <div id="dashboard-summary"></div>

</section>

<section class="parent-tabs">

    <button
        class="tab-button active"
        data-tab="overview">

        Overview

    </button>

    <button
        class="tab-button"
        data-tab="skills">

        Skills

    </button>

    <button
        class="tab-button"
        data-tab="statistics">

        Statistics

    </button>

    <button
        class="tab-button"
        data-tab="recommendations">

        Recommendations

    </button>

</section>

<section
    id="overview-tab"
    class="tab-panel active">

    <div
        id="overall-progress">
    </div>

</section>

<section
    id="skills-tab"
    class="tab-panel">

    <div
        id="skills-report">
    </div>

</section>

<section
    id="statistics-tab"
    class="tab-panel">

    <div
        id="statistics">
    </div>

</section>

<section
    id="recommendations-tab"
    class="tab-panel">

    <div
        id="recommendations">
    </div>

</section>

</main>



<script
    type="module"
    src="/src/parent.ts">
</script>


</body>

</html>
